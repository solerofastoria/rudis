version: "3.9"

services:
  # === PostgreSQL ===
  postgres:
    image: postgres:15
    container_name: discord_clone_db
    restart: always
    environment:
      POSTGRES_DB: discord_clone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  # === Redis ===
  redis:
    image: redis:7
    container_name: discord_clone_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network

  # === Backend (Node.js) ===
  backend:
    build:
      context: ./backend
    container_name: discord_clone_backend
    restart: always
    ports:
      - "5001:5000"
    depends_on:
      - postgres
      - redis
    networks:
      - app-network
    command: npm run dev
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=discord_clone
      - DB_USER=postgres
      - DB_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your_super_secret_jwt_key_here
      - JWT_EXPIRES_IN=7d
      - FRONTEND_URL=http://localhost:3000
      - PORT=5000

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge