services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rudis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rudis-net

  redis:
    image: redis:7
    networks:
      - rudis-net

  backend:
    build: ./backend
    container_name: rudis_backend
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis
    networks:
      - rudis-net
    command: >
      sh -c "
        npx sequelize-cli db:migrate &&
        node src/index.js
      "

  frontend:
    build: ./frontend
    container_name: rudis_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - rudis-net

networks:
  rudis-net:

volumes:
  postgres_data:
