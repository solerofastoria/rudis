version: "3.9"

services:
  # === PostgreSQL ===
  postgres:
    image: postgres:15
    container_name: discord_clone_db
    restart: always
    environment:
      POSTGRES_DB: discord_clone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  # === Redis ===
  redis:
    image: redis:7
    container_name: discord_clone_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network

  # === Backend (Node.js) ===
  backend:
    build:
      context: ./backend
    container_name: discord_clone_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    networks:
      - app-network
    command: npm run dev

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge