services:
  postgres:
    image: postgres:16
    container_name: rudis_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rudis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - rudis-net

  redis:
    image: redis:7
    container_name: rudis_redis
    ports:
      - "6379:6379"
    networks:
      - rudis-net

  backend:
    build: ./backend
    container_name: rudis_backend
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    networks:
      - rudis-net
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    container_name: rudis_frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - rudis-net
    depends_on:
      - backend

networks:
  rudis-net:

volumes:
  postgres_data: